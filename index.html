<input id="nick">
<button onclick="loadStats()">OK</button>

<div id="result"></div>

<script>
async function loadStats() {
    let nick = document.getElementById("nick").value;

    let res = await fetch(https://3947e5d8-0c2a-489b-ac5b-07c57772c35f-00-61wvxlhvshn.janeway.replit.dev//stats?nick=" + nick);
    let data = await res.json();

    document.getElementById("result").innerHTML =
        "Бої: " + data.battles;
}
</script>
