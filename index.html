<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>WoT Stats</title>

<style>
body {
    font-family: Arial;
    background: #111;
    color: white;
    text-align: center;
    padding-top: 50px;
}

input {
    padding: 10px;
    width: 220px;
}

button {
    padding: 10px;
    cursor: pointer;
}

#result {
    margin-top: 20px;
    font-size: 18px;
}
</style>
</head>

<body>

<h2>WoT Blitz Stats</h2>

<input id="nick" placeholder="Введи нік">
<button onclick="loadStats()">Пошук</button>

<div id="result"></div>

<script>
async function loadStats() {
    let nick = document.getElementById("nick").value;
    let out = document.getElementById("result");

    out.innerHTML = "Завантаження...";

    try {
        let res = await fetch("https://ing-ex-tool--kashamana08.replit.app/stats?nick=" + nick
);
        let data = await res.json();

        if (data.error) {
            out.innerHTML = "Гравця не знайдено";
            return;
        }

        let wr = (data.wins / data.battles * 100).toFixed(2);

        out.innerHTML = `
            <p>БоЇ: ${data.battles}</p>
            <p>Перемоги: ${data.wins}</p>
            <p>Win Rate: ${wr}%</p>
        `;
    } catch (e) {
        out.innerHTML = "Помилка сервера";
    }
}
</script>

</body>
</html>
